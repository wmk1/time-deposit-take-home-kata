services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: time_deposits
      POSTGRES_USER: time_deposits
      POSTGRES_PASSWORD: time_deposits
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "time_deposits", "-d", "time_deposits"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
