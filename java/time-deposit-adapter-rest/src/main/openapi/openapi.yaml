openapi: 3.0.3
info:
  title: XA Bank Time Deposits
  version: 1.0.0
paths:
  /time-deposits:
    get:
      operationId: getAllTimeDeposits
      summary: List all time deposits and their withdrawals
      responses:
        '200':
          description: Deposits with their withdrawal history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDepositResponse'
  /time-deposits/balance-updates:
    post:
      operationId: updateAllBalances
      summary: Apply one month of interest to all time deposits
      description: Every successful call applies another month of interest without advancing the stored days.
      responses:
        '204':
          description: All balances have been updated
components:
  schemas:
    TimeDepositResponse:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
        planType:
          type: string
        balance:
          type: number
          format: double
        days:
          type: integer
          format: int32
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalResponse'
    WithdrawalResponse:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
        amount:
          type: number
        date:
          type: string
          format: date
